name: Feature request
description: Suggest an idea or capability for DevPaper
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We love ideas that enhance code presentation, typography, developer workflows, or AI agent typesetting!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation or pain point.
      placeholder: I am frustrated when trying to format code snippets for...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of the behavior, UI, or API you want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any workaround or alternative solutions you have evaluated.
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Syntax Theme or Developer Font
        - Paper Preset or Sizing Format
        - Window Chrome or Canvas Background
        - Headless API / Python Backend
        - AI Agent Integration (/agent, /ai)
        - Performance & Export Pipeline
    validations:
      required: true
